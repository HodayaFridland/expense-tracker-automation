<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head >
<body>
  <h1>Expense Tracker</h1>

  <form id="transaction-form">
    <input id="amount-input" type="number" step="0.01" placeholder="Amount" />
    <select id="type-input">
      <option value="expense">Expense➕</option>
      <option value="income">Income➖</option>
    </select>
    <input id="category-input" type="text" placeholder="Category" />
    <input id="date-input" type="date" />
    <button id="add-button" type="submit">Add</button>
  </form>

  <p id="error-message"></p>

  <div id="summary">
    Income: <span id="total-income">0</span> |
    Expenses: <span id="total-expenses">0</span> |
    Balance: <span id="balance">0</span>
  </div>

  <table id="transactions-table">
    <thead><tr><th>Date</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead>
    <tbody id="transactions-body"></tbody>
  </table>
  <p id="empty-message"></p>

  <script src="app.js"></script>
</body>
</html>
